<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Видеомониторинг MVP</title>
    <!-- Подключаем библиотеку HLS.js для воспроизведения -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { margin: 0; background-color: #121212; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif;}
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; width: 98vw; height: 95vh; max-width: 1600px; }
        .cam-container { position: relative; width: 100%; height: 100%; background: #000; border: 1px solid #333; }
        video { width: 100%; height: 100%; object-fit: contain; }
        .label { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: #fff; padding: 5px 10px; border-radius: 4px; font-size: 14px; font-weight: bold; pointer-events: none; z-index: 10;}
    </style>
</head>
<body>

<div class="grid">
    <div class="cam-container"><div class="label">Камера 1</div><video id="cam1" autoplay muted controls></video></div>
    <div class="cam-container"><div class="label">Камера 2</div><video id="cam2" autoplay muted controls></video></div>
    <div class="cam-container"><div class="label">Камера 3</div><video id="cam3" autoplay muted controls></video></div>
    <div class="cam-container"><div class="label">Камера 4</div><video id="cam4" autoplay muted controls></video></div>
</div>

<script>
    // ВСТАВЬТЕ СЮДА ВАШУ ССЫЛКУ ИЗ CLOUDFLARE (БЕЗ СЛЭША НА КОНЦЕ)
    const base = "https://kst-camera-mvp.loca.lt";
    
    function setupVideo(id, streamPath) {
        var video = document.getElementById(id);
        var url = base + streamPath;
        
        if (Hls.isSupported()) {
            var hls = new Hls({
                maxBufferLength: 10,
                maxMaxBufferLength: 20,
                liveSyncDurationCount: 3
            });
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.ERROR, function (event, data) {
                if (data.fatal) {
                    switch (data.type) {
                        case Hls.ErrorTypes.NETWORK_ERROR:
                            console.log("Обернулась сетевая ошибка, пробуем восстановить...");
                            hls.startLoad();
                            break;
                        case Hls.ErrorTypes.MEDIA_ERROR:
                            console.log("Ошибка медиа, пытаемся восстановить...");
                            hls.recoverMediaError();
                            break;
                        default:
                            hls.destroy();
                            setTimeout(() => setupVideo(id, streamPath), 2000);
                            break;
                    }
                }
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            // Для Safari на iOS
            video.src = url;
        }
    }
    
    // Запускаем потоки
    setupVideo('cam1', '/cam1/index.m3u8');
    setupVideo('cam2', '/cam2/index.m3u8');
    setupVideo('cam3', '/cam3/index.m3u8');
    setupVideo('cam4', '/cam4/index.m3u8');
</script>

</body>
</html>
